{% load dashboard_extras %}
{% for cl in rows %}
<tr>
    <td style="font-weight:600;">{{ cl.cluster }}</td>
    <td class="num">{{ cl.revenue|fmt_rupee }}</td>
    <td class="num {% if cl.growth >= 0 %}growth-up{% else %}growth-down{% endif %}">
        {% if cl.growth >= 0 %}▲{% else %}▼{% endif %} {{ cl.growth|abs_val }}%
    </td>
    <td class="num">{{ cl.contribution }}%</td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="empty">No data available</td>
</tr>
{% endfor %}
