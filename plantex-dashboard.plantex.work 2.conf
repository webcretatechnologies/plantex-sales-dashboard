# ─── Redirect IP to domain (HTTP + HTTPS) ────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name 209.182.233.109;

    ssl_certificate /etc/letsencrypt/live/admin.plantex.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.plantex.work/privkey.pem;

    location / {
        return 301 https://admin.plantex.work$request_uri;
    }
}

# ─── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    server_name admin.plantex.work;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (main) ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.plantex.work;

    ssl_certificate /etc/letsencrypt/live/admin.plantex.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.plantex.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 600M;

    # ─── Security Headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip (offload from Django GZipMiddleware) ───────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/pltx_static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /ws/ {
        proxy_pass http://plantex-dashboard:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    location / {
        proxy_pass http://plantex-dashboard:8000;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}